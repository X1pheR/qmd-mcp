name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      expected_sha:
        description: Exact commit SHA the tag must resolve to
        required: true
        type: string

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Verify immutable publication target
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "${TAG}"
          test -n "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git rev-parse "${TAG}^{commit}")" = "${EXPECTED_SHA}"
          version="$(node -p "require('./package.json').version")"
          test "${TAG}" = "v${version}"
          server_version="$(node -p "require('./server.json').version")"
          server_name="$(node -p "require('./server.json').name")"
          test "${server_version}" = "${version}"
          test "${server_name}" = "io.github.X1pheR/qmd-mcp"

      - name: Install verified mcp-publisher
        shell: bash
        env:
          PUBLISHER_VERSION: '1.7.9'
          PUBLISHER_SHA256: 'ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/${archive}"
          echo "${PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" mcp-publisher
          chmod 0755 mcp-publisher
          ./mcp-publisher --version

      - name: Validate Registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish server.json
