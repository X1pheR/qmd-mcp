name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to recover
        required: true
        type: string
      expected_sha:
        description: Exact commit SHA the release tag must resolve to
        required: true
        type: string

permissions: read-all

env:
  IMAGE: ghcr.io/x1pher/qmd-mcp

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify release version and revision
        id: version
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${DISPATCH_TAG}"
            test -n "${EXPECTED_SHA}"
            test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          test "${tag}" = "v${version}"
          revision="$(git rev-parse "${tag}^{commit}")"
          test "${revision}" = "$(git rev-parse HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - name: Run canonical local verifier
        env:
          VERIFY_REVISION: ${{ steps.version.outputs.revision }}
        run: ./scripts/verify.sh

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.version.outputs.revision }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          attestation_asset="qmd-mcp-${RELEASE_TAG}.sigstore.json"
          test -s "${ATTESTATION_BUNDLE}"
          cp "${ATTESTATION_BUNDLE}" "${attestation_asset}"
          cat > release-notes.md <<EOF2
          Container image:

          \`${IMAGE}:${RELEASE_TAG}\`

          Immutable digest:

          \`${IMAGE_DIGEST}\`

          Deployments should select the stable version tag. The resolved digest above is immutable provenance and live-acceptance evidence for that release.
          EOF2
          gh release create "${RELEASE_TAG}" \
            "${attestation_asset}#Sigstore attestation bundle" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md
